# Unsigned macOS build of the fork, published as a GitHub Release.
# Push a tag like `fork-v0.0.46-spaces.1` from `dev`; the part after `fork-v`
# becomes the app version. The build is branded "Oh My T3 Code" with its own
# bundle id (scripts/build-desktop-artifact.ts), so macOS privacy grants don't
# collide with an installed upstream T3 Code.
name: Fork Release

on:
  push:
    tags:
      - "fork-v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS arm64
    if: github.repository == 'nguyenphutrong/t3code'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#fork-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 --build-version "$version"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Oh-My-T3-Code-* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Oh My T3 Code $VERSION" \
            --notes "Unsigned build of \`dev\` at ${GITHUB_SHA::10}. macOS blocks unsigned downloads; after copying the app to /Applications run:

          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/Oh My T3 Code.app\"
          \`\`\`"
