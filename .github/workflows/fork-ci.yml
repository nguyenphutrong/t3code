# Checks for the nguyenphutrong/t3code fork. Upstream workflows run on
# Blacksmith runners and Ping's secrets, so they are disabled on the fork with
# `gh workflow disable`; this file is new and never conflicts when syncing.
name: Fork CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    if: github.repository == 'nguyenphutrong/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      # The packages Spaces touches. Server tests need the sharded upstream setup.
      - name: Test
        run: vp run --filter @t3tools/web --filter @t3tools/client-runtime --filter @t3tools/shared --filter @t3tools/contracts test
